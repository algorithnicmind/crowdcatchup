name: Keep Render Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *' # Runs every 10 minutes to prevent Render free tier sleep
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Docs Endpoint
        run: curl -s -o /dev/null -w "%{http_code}" https://crowdcatchup.onrender.com/docs || echo "Ping failed but workflow continues"
